];
const cats=[["Technical","💻"],["Cultural","🎭"],["Sports","⚽"],["Workshop","🛠️"],["Hackathon","🚀"],["Seminar","🎤"],["Music","🎵"],["Entrepreneurship","💡"]];
const dateLabel=d=>new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
function App(){const [page,setPage]=useState("Home"),[selected,setSelected]=useState(null),[search,setSearch]=useState(""),[cat,setCat]=useState("All Events"),[time,setTime]=useState("Any time"),[free,setFree]=useState(false),[sort,setSort]=useState("Upcoming First"),[saved,setSaved]=useState(()=>JSON.parse(localStorage.getItem("cc-bookmarks")||"[]")),[theme,setTheme]=useState(()=>localStorage.getItem("cc-theme")||"light"),[menu,setMenu]=useState(false),[modal,setModal]=useState(false);
useEffect(()=>{localStorage.setItem("cc-bookmarks",JSON.stringify(saved))},[saved]);useEffect(()=>{document.documentElement.dataset.theme=theme;localStorage.setItem("cc-theme",theme)},[theme]);
const toggleSave=id=>setSaved(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);const go=(p,c="All Events")=>{setPage(p);setCat(c);setSelected(null);setMenu(false);window.scrollTo(0,0)};
const filtered=events.filter(e=>{const q=search.toLowerCase();const match=[e.title,e.college,e.location,e.category,e.organizer].some(x=>x.toLowerCase().includes(q));let dateok=true;const today=new Date("2026-10-25T00:00:00");const d=new Date(e.date+"T00:00:00");if(time==="Upcoming Events")dateok=d>=today;if(time==="Today")dateok=e.date==="2026-10-25";if(time==="This Week"){const end=new Date(today);end.setDate(end.getDate()+7);dateok=d>=today&&d<=end;}return match&&(cat==="All Events"||e.category===cat)&&dateok&&(!free||e.price===0)});
const sorted=[...filtered].sort((a,b)=>sort==="Alphabetical"?a.title.localeCompare(b.title):sort==="Latest Added"?b.id.localeCompare(a.id):a.date.localeCompare(b.date));
const savedEvents=events.filter(e=>saved.includes(e.id));
const card=e=><article className="event" key={e.id}><div className="eventimg"><img src={e.image} alt={e.title} onError={ev=>{ev.currentTarget.style.display="none";ev.currentTarget.parentElement.insertAdjacentHTML("beforeend",'<div class=\"fallback\">🎓</div>')}}/><span className="categorybadge">{e.category}</span><button className={"bookmark "+(saved.includes(e.id)?"saved":"")} aria-label="Bookmark event" onClick={()=>toggleSave(e.id)}>{saved.includes(e.id)?"♥":"♡"}</button></div><div className="eventbody"><h3 className="eventtitle">{e.title}</h3><div className="college">{e.college} · {e.organizer}</div><p className="desc">{e.shortDescription}</p><div className="meta"><span>◷ {dateLabel(e.date)}</span><span>⌖ {e.venue}</span></div><div className="eventfoot"><span className="price">{e.price===0?"FREE":"₹"+e.price}</span><button className="view" onClick={()=>{setSelected(e);setPage("Details");window.scrollTo(0,0)}}>View details →</button></div></div></article>;
const header=<header className={"nav "+(menu?"mobileopen":"")}><div className="wrap navin"><button className="logo" onClick={()=>go("Home")}><span className="logoicon">✦</span>CampusConnect</button><nav className="links"><button className={page==="Home"?"active":""} onClick={()=>go("Home")}>Home</button><button className={page==="Events"?"active":""} onClick={()=>go("Events")}>Explore Events</button><button className={page==="Bookmarks"?"active":""} onClick={()=>go("Bookmarks")}>Bookmarks <span className="badgecount">{saved.length}</span></button><button className={page==="About"?"active":""} onClick={()=>go("About")}>About</button></nav><div className="right"><button className="iconbtn" aria-label="Toggle theme" onClick={()=>setTheme(theme==="light"?"dark":"light")}>{theme==="light"?"☾":"☀"}</button><button className="menu mobilemenu" onClick={()=>setMenu(!menu)} aria-label="Menu">{menu?"✕":"☰"}</button></div></div></header>;
const footer=<footer className="footer"><div className="wrap footin"><div><div className="logo"><span className="logoicon">✦</span>CampusConnect</div><p>Discover. Explore. Experience. Your campus, connected.</p></div><div className="footlinks"><button className="textbtn" onClick={()=>go("Events")}>Explore Events</button><button className="textbtn" onClick={()=>go("Bookmarks")}>Bookmarks</button><button className="textbtn" onClick={()=>go("About")}>About</button></div><div>© 2026 CampusConnect </div></div></footer>;
return <>{header}<main className="wrap">
{page==="Home"&&<><section className="hero"><div><div className="eyebrow"></div><h1>Your Campus.<br/>Your Events.<br/><span>Your Experience.</span></h1><p>Discover exciting college events, connect with communities, and never miss an opportunity happening around your campus.</p><div className="actions"><button className="primary" onClick={()=>go("Events")}>Explore Events ↗</button><button className="secondary" onClick={()=>go("Bookmarks")}>♡ View Bookmarks</button></div></div><div className="heroart" aria-label="Campus event illustration"><div className="artblob"></div><div className="artcard one"><span className="arttag">✦ FEATURED EVENT</span><div className="arttitle">CodeSprint 2026</div><div className="artsmall">Build. Collaborate. Create.</div><div className="avatarrow"><i className="avatar"></i><i className="avatar"></i><i className="avatar"></i><i className="avatar"></i></div></div><div className="artcard two"><div className="artsmall">UP NEXT · NOV 14</div><div className="arttitle">Spectrum Night 🎭</div><span className="arttag">CULTURAL</span></div></div></section>
<section className="section"><div className="sectionhead"><div><div className="eyebrow">HANDPICKED FOR YOU</div><h2>Featured events</h2><p>Don't miss what's happening around campus.</p></div><button className="textbtn" onClick={()=>go("Events")}>View all events →</button></div><div className="grid">{events.filter(e=>e.featured).slice(0,3).map(card)}</div></section>
<section className="section"><div className="sectionhead"><div><div className="eyebrow">FIND YOUR THING</div><h2>Browse by category</h2><p>There's something for every interest.</p></div></div><div className="categories">{cats.map(([c,emoji])=><button className="cat" key={c} onClick={()=>go("Events",c)}><span className="emoji">{emoji}</span><span>{c}</span></button>)}</div></section>
<section className="section"><div className="sectionhead"><div><div className="eyebrow">MARK YOUR CALENDAR</div><h2>Upcoming events</h2><p>Make room for your next great experience.</p></div><button className="textbtn" onClick={()=>go("Events")}>Explore all →</button></div><div className="grid">{events.slice(3,6).map(card)}</div></section>
<section className="section"><div className="sectionhead"><div><div className="eyebrow">MADE FOR CAMPUS LIFE</div><h2>More than an event calendar</h2></div></div><div className="categories" style={{gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))"}}>{[["🔎","Discover opportunities","Find events and experiences that match your interests."],["🤝","Explore communities","Meet clubs, organizers, and people who share your passion."],["🔔","Stay updated","Keep important dates and campus happenings in view."],["♡","Save your favorites","Bookmark events and come back whenever you're ready."]].map(([i,t,d])=><div className="cat" style={{textAlign:"left",padding:20}} key={t}><span className="emoji">{i}</span><b>{t}</b><p className="desc" style={{marginTop:9}}>{d}</p></div>)}</div></section><div className="cta"><div><h2>Your next unforgettable campus experience starts here.</h2><p>Find your people. Discover your next thing.</p></div><button className="primary" style={{background:"white",color:"#635bdb"}} onClick={()=>go("Events")}>Explore Events →</button></div></>}
{page==="Events"&&<><div className="pagehead"><div className="eyebrow">THE CAMPUS CALENDAR</div><h1>Discover Campus Events</h1><p>Find your next opportunity, experience, or unforgettable moment.</p></div><div className="filters"><div className="search"><span className="glass">⌕</span><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search events, colleges, organizers..." aria-label="Search events"/></div><select value={time} onChange={e=>setTime(e.target.value)}><option>Any time</option><option>Upcoming Events</option><option>Today</option><option>This Week</option></select><select value={sort} onChange={e=>setSort(e.target.value)}><option>Upcoming First</option><option>Latest Added</option><option>Alphabetical</option></select><label className="secondary" style={{padding:"11px 13px",fontSize:13}}><input type="checkbox" checked={free} onChange={e=>setFree(e.target.checked)}/> Free only</label></div><div className="chips"><button className={"chip "+(cat==="All Events"?"active":"")} onClick={()=>setCat("All Events")}>All Events</button>{cats.map(([c])=><button key={c} className={"chip "+(cat===c?"active":"")} onClick={()=>setCat(c)}>{c}</button>)}</div><div className="resultline"><span>{sorted.length} events found</span>{(search||cat!=="All Events"||time!=="Any time"||free)&&<button className="clear" onClick={()=>{setSearch("");setCat("All Events");setTime("Any time");setFree(false);setSort("Upcoming First")}}>Clear filters ×</button>}</div>{sorted.length?<div className="grid">{sorted.map(card)}</div>:<div className="empty"><div className="big">🔎</div><h2>No events found</h2><p>Try changing your search or clearing the filters.</p><button className="primary" onClick={()=>{setSearch("");setCat("All Events");setTime("Any time");setFree(false)}}>Clear filters</button></div>}</>}
{page==="Bookmarks"&&<><div className="pagehead"><div className="eyebrow">YOUR PERSONAL COLLECTION</div><h1>Bookmarked Events</h1><p>All the campus experiences you saved, in one place.</p></div>{savedEvents.length?<><div className="resultline"><span>{savedEvents.length} saved event{savedEvents.length!==1?"s":""}</span><button className="clear" onClick={()=>setSaved([])}>Remove all</button></div><div className="grid">{savedEvents.map(card)}</div></>:<div className="empty"><div className="big">♡</div><h2>No bookmarked events yet.</h2><p>Save events you're interested in and they'll show up here.</p><button className="primary" onClick={()=>go("Events")}>Explore Events →</button></div>}</>}
{page==="Details"&&selected&&<><button className="textbtn" onClick={()=>go("Events")}>← Back to Events</button><div className="detailhero"><img src={selected.image} alt={selected.title} onError={e=>e.currentTarget.style.display="none"}/></div><div className="detailcontent"><div><span className="categorybadge" style={{position:"static",display:"inline-block",background:"var(--soft)",color:"var(--primary)"}}>{selected.category}</span><h1 style={{fontSize:"clamp(30px,4vw,44px)",letterSpacing:"-1.5px"}}>{selected.title}</h1><div className="college">{selected.college} · Organized by {selected.organizer}</div><div className="panel"><h2>About this event</h2><p>{selected.description}</p></div><div className="panel"><h2>What to expect</h2><ul className="highlightlist">{selected.highlights.map(h=><li key={h}>{h}</li>)}</ul></div><div className="panel"><h2>Eligibility</h2><p>{selected.eligibility}</p></div><div className="panel"><h2>Registration</h2><p>Registration deadline: {dateLabel(selected.registrationDeadline)}</p><p>Entry fee: {selected.price===0?"Free":"₹"+selected.price}</p></div></div><aside className="sideinfo"><div className="panel"><div className="row"><small>DATE</small>📅 {dateLabel(selected.date)}</div><div className="row"><small>TIME</small>◷ {selected.time}</div><div className="row"><small>VENUE</small>⌖ {selected.venue}</div><div className="row"><small>LOCATION</small>{selected.location}</div><div className="row"><small>ENTRY</small><b className="price">{selected.price===0?"FREE":"₹"+selected.price}</b></div><button className="primary" style={{width:"100%",marginTop:18}} onClick={()=>selected.registrationUrl?window.open(selected.registrationUrl,"_blank","noopener"):setModal(true)}>Register Now ↗</button><button className="secondary" style={{width:"100%",marginTop:10}} onClick={()=>toggleSave(selected.id)}>{saved.includes(selected.id)?"♥ Bookmarked":"♡ Bookmark Event"}</button></div></aside></div></>}
{page==="About"&&<div className="abt">&nbsp;&nbsp;<div className="eyebrow">OUR PURPOSE</div><h1>Campus life, connected.</h1><p>CampusConnect is a student-first event discovery experience designed to make campus opportunities easier to find. From hackathons and workshops to cultural nights and sports, we bring the campus calendar into one friendly place.</p><p>Explore events, discover communities, and save the experiences you don't want to miss.</p><div className="actions"><button className="primary" onClick={()=>go("Events")}>Explore Events →</button><button className="secondary" onClick={()=>go("Home")}>Back Home</button></div></div>}
</main>{footer}
{modal&&<div className="modalbg" onClick={()=>setModal(false)}><section className="modal" onClick={e=>e.stopPropagation()}><h2>Registration information</h2><p>Registration details for <b>{selected?.title}</b> are not available in this demo. Please contact the event organizer or check your college's official announcements.</p><div className="notice">Organizer: {selected?.organizer}<br/>College: {selected?.college}</div><div className="modalactions"><button className="secondary" onClick={()=>setModal(false)}>Close</button><button className="primary" onClick={()=>{setModal(false);toggleSave(selected.id)}}>Save event ♡</button></div></section></div>}
</>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
